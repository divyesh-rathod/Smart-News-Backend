[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "model: downloads Hugging Face model weights (skipped in CI)",
    "db: uses the db fixture, i.e. a migrated Postgres + pgvector database at TEST_DATABASE_URL (added automatically)",
]

[tool.ruff]
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
